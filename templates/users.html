{% extends "base.html" %}
{% block title %}账号管理 - {{ super() }}{% endblock %}

{% block content %}
<div class="page-heading"><div><h4><i class="bi bi-people me-1"></i> 协同账号管理</h4><p class="subheading">为工厂、采购、质检和管理人员创建登录账号。</p></div></div>
<div class="row g-4">
    <div class="col-lg-5"><div class="card"><div class="card-header">新增账号</div><div class="card-body">
        <form method="POST" action="{{ url_for('user_add') }}">
            <div class="mb-3"><label class="form-label">账号</label><input class="form-control" name="username" required></div>
            <div class="mb-3"><label class="form-label">显示名称</label><input class="form-control" name="display_name"></div>
            <div class="mb-3"><label class="form-label">初始密码（至少 8 位）</label><input class="form-control" name="password" type="password" minlength="8" required></div>
            <div class="mb-3"><label class="form-label">权限</label><select class="form-select" name="role"><option value="editor">编辑：可修改生产数据</option><option value="admin">管理员：可管理账号</option></select></div>
            <button class="btn btn-primary w-100">创建账号</button>
        </form>
    </div></div></div>
    <div class="col-lg-7"><div class="card"><div class="card-header">现有账号</div><div class="card-body p-0"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>账号</th><th>名称</th><th>权限</th><th>状态</th></tr></thead><tbody>{% for user in users %}<tr><td>{{ user.username }}</td><td>{{ user.display_name or '-' }}</td><td>{{ '管理员' if user.role == 'admin' else '编辑者' }}</td><td><span class="badge bg-success">正常</span></td></tr>{% endfor %}</tbody></table></div></div></div></div>
</div>
{% endblock %}
