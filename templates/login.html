{% extends "base.html" %}
{% block title %}登录 - {{ super() }}{% endblock %}
{% block body_class %}login-page{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4">
                    <div class="display-6 text-primary mb-2"><i class="bi bi-shield-lock"></i></div>
                    <h4 class="mb-1">登录工厂生产协同</h4>
                    <p class="text-muted small mb-0">登录后才可以修改生产数据</p>
                </div>
                <form method="POST">
                    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                    <div class="mb-3"><label class="form-label" for="username">账号</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
                    <div class="mb-4"><label class="form-label" for="password">密码</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
                    <button class="btn btn-primary w-100" type="submit">登录</button>
                </form>
                <div class="text-center mt-4"><a href="{{ url_for('index') }}" class="small text-muted">只查看生产进度</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
